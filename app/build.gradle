apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-android'
android {
    compileSdkVersion 33
    //buildToolsVersion '30.0.2'
    defaultConfig {
        applicationId "com.srapp_omni_care"
        minSdkVersion 21
        multiDexEnabled true
        targetSdkVersion 33
        versionCode 11
        versionName "4.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    useLibrary("org.apache.http.legacy")
    kotlinOptions {
        jvmTarget = "1.8"
    }
    aaptOptions {
        noCompress "tflite"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation ('androidx.appcompat:appcompat:1.4.0-alpha02')
    implementation ('com.android.support:appcompat-v7:28.0.0')
    implementation ('com.android.support:design:28.0.0')
    implementation ('androidx.constraintlayout:constraintlayout:1.1.3')
    implementation ('com.google.android.material:material:1.0.0')
    //implementation ('com.google.firebase:firebase-crashlytics-buildtools:2.9.0')
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    testImplementation ('junit:junit:4.12')
    implementation ('com.github.Tanvir3488:TAapi2:1')
    implementation ('com.android.support:multidex:1.0.3')

    implementation ('io.jsonwebtoken:jjwt:0.6.0')
    implementation ('commons-codec:commons-codec:1.3')
    implementation ('com.auth0.android:jwtdecode:1.3.0')
    implementation ('com.auth0:java-jwt:3.8.3')
    implementation ('com.google.firebase:firebase-analytics:17.2.2'){
        {
            {
                exclude group: 'com.google.zxing', module: 'android-core'
                transitive = false
            }
        }
    }
    implementation 'com.google.firebase:firebase-crashlytics:17.1.0'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'com.whiteelephant:monthandyearpicker:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation 'com.weiwangcn.betterspinner:library-material:1.1.0'
    implementation files('libs/bixolon_printer.jar')
    implementation files('libs/jpos-controls.jar')
    implementation files('libs/opencv-2.4.13.6.jar')
    implementation files('libs/xerces.jar')
    implementation files('libs/xerces.jar')
    implementation files('libs/printersdkv2.jar')
    implementation ('com.intuit.sdp:sdp-android:1.0.6')

    //retrofit networking lib-----------------------------------------------------------------------
    implementation 'com.squareup.retrofit2:retrofit:2.7.1'
    implementation 'com.squareup.retrofit2:converter-gson:2.7.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation ('com.squareup.okhttp3:okhttp:4.9.0')
    implementation ('com.squareup.okhttp3:logging-interceptor:4.9.0')
    implementation ('com.android.support:multidex:1.0.3')
    implementation ('androidx.appcompat:appcompat:1.2.0')
    implementation ('androidx.navigation:navigation-fragment:2.3.4'){
        {
            exclude group: 'com.google.zxing', module: 'android-core'
            transitive = false
        }
    }
    implementation 'androidx.navigation:navigation-ui:2.3.4'
    implementation 'com.squareup.okhttp3:okhttp:4.9.0'

    //recyler_view----------------------------------------------------------------------------------

    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'com.itextpdf:itextg:5.5.10'




    // Glide image loading
    implementation 'com.github.bumptech.glide:glide:3.7.0'

    implementation 'com.squareup.retrofit2:converter-scalars:2.3.0'

    //implementation project(path: ':escposprinter')

    implementation ('com.github.DantSu:ESCPOS-ThermalPrinter-Android:3.3.0'){
        {
            exclude group: 'com.google.zxing', module: 'android-core'
            transitive = false
        }
    }

        implementation 'com.wdullaer:materialdatetimepicker:4.2.3'

    implementation 'com.squareup.okhttp3:okhttp:4.9.0'

    implementation 'com.google.android.gms:play-services-location:21.0.1'
    def camerax_version = "1.2.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit Face Detection (on-device)
    implementation "com.google.mlkit:face-detection:16.1.7"
    implementation "com.google.mlkit:vision-common:17.3.0"
    // TFLite runtime
    implementation "org.tensorflow:tensorflow-lite:2.14.0"
    implementation "androidx.work:work-runtime:2.7.1"

    implementation(platform("com.google.firebase:firebase-bom:32.0.0"))
    implementation 'com.google.firebase:firebase-messaging:21.1.0'
    implementation("com.google.firebase:firebase-analytics")
    implementation 'com.toptoche.searchablespinner:searchablespinnerlibrary:1.3.1'
    implementation "androidx.exifinterface:exifinterface:1.3.7"
}
